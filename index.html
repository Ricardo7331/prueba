<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi lista de tareas</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #352052; background: #efe7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #e9d5ff 0%, #f5f0ff 50%, #ddd6fe 100%); }
    main { width: min(100%, 480px); background: #fffaff; border: 1px solid #e9d5ff; border-radius: 20px; padding: 30px; box-shadow: 0 16px 45px #6b21a82e; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; color: #6b21a8; }
    p { color: #7c6399; margin: 0 0 24px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 12px; border: 1px solid #d8b4fe; border-radius: 10px; font: inherit; background: #faf5ff; color: #352052; }
    input[type="text"]:focus { outline: 2px solid #a855f7; outline-offset: 2px; }
    button { border: none; border-radius: 10px; padding: 11px 14px; font: inherit; cursor: pointer; }
    form button { background: #7e22ce; color: white; font-weight: 600; }
    form button:hover { background: #6b21a8; }
    ul { list-style: none; padding: 0; margin: 22px 0 0; }
    li { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ede9fe; padding: 12px 0; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.completed span { text-decoration: line-through; color: #a78bba; }
    li input { width: 18px; height: 18px; cursor: pointer; accent-color: #9333ea; }
    li button { background: #f3e8ff; color: #7e22ce; padding: 6px 10px; }
    li button:hover { background: #e9d5ff; }
    #empty { text-align: center; margin: 25px 0 0; }
    footer { margin-top: 18px; color: #7c6399; font-size: .9rem; }
    .profiles{background:#f3e8ff;border:1px solid #e9d5ff;border-radius:14px;padding:14px;margin:15px 0 22px}
    .profiles label{display:block;margin-bottom:8px;color:#6b21a8}
    .profiles select{width:100%;padding:11px;border:1px solid #d8b4fe;border-radius:9px;background:white;color:#352052;font:inherit;margin-bottom:10px}
    .profiles form{flex-wrap:wrap}.profiles small{color:#795b93;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <h1>✅ Mi lista de tareas</h1>
    <section class="profiles">
      <label for="user-select"><strong>👤 Usuario activo</strong></label>
      <select id="user-select" aria-label="Seleccionar usuario"></select>
      <form id="user-form"><input id="user-name" type="text" maxlength="30" required placeholder="Nombre del nuevo usuario"><button type="submit">Crear usuario</button></form>
      <p id="user-message" role="status" style="margin:8px 0;font-size:.85rem"></p>
      <small>Perfiles locales: sin contraseña ni sincronización entre dispositivos.</small>
    </section>
    <p>Organiza tus pendientes de forma sencilla.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Escribe una tarea..." maxlength="150" required aria-label="Nueva tarea">
      <button type="submit">Agregar</button>
    </form>
    <ul id="task-list" aria-label="Lista de tareas"></ul>
    <p id="empty">Aún no tienes tareas. ¡Agrega una!</p>
    <footer id="counter">0 tareas pendientes</footer>
    <p style="margin:18px 0 0;text-align:center"><a href="./calculadora.html" style="color:#7e22ce;font-weight:600">🧮 Abrir calculadora científica</a></p>
  </main>
  <script>
    const LEGACY_KEY = "prueba_todo_tasks";
    const USERS_KEY = "prueba_todo_users";
    const ACTIVE_KEY = "prueba_todo_active_user";
    const selectUser = document.getElementById("user-select");
    const userForm = document.getElementById("user-form");
    const userName = document.getElementById("user-name");
    const userMessage = document.getElementById("user-message");
    function readJSON(key,fallback){try {const value=JSON.parse(localStorage.getItem(key));return value===null?fallback:value;}catch{return fallback;}}
    let users=readJSON(USERS_KEY,[]);
    if(!Array.isArray(users))users=[];
    users=users.filter(u=>u&&typeof u.id==="string"&&typeof u.name==="string");
    if(!users.length)users=[{id:"default",name:"Principal"}];
    let activeUser=localStorage.getItem(ACTIVE_KEY);
    if(!users.some(u=>u.id===activeUser))activeUser=users[0].id;
    function userTasksKey(){return activeUser==="default"?LEGACY_KEY:"prueba_todo_tasks_"+activeUser;}
    function loadTasks(){const stored=readJSON(userTasksKey(),[]);return Array.isArray(stored)?stored.filter(t=>t&&typeof t.text==="string"&&typeof t.done==="boolean"):[];}
    function persistUsers(){try{localStorage.setItem(USERS_KEY,JSON.stringify(users));localStorage.setItem(ACTIVE_KEY,activeUser);}catch{}}
    function renderUsers(){selectUser.replaceChildren();users.forEach(u=>{const opt=document.createElement("option");opt.value=u.id;opt.textContent=u.name;selectUser.append(opt);});selectUser.value=activeUser;}
    persistUsers();renderUsers();
    selectUser.addEventListener("change",()=>{activeUser=selectUser.value;persistUsers();tasks=loadTasks();render();});
    userForm.addEventListener("submit",event=>{
      event.preventDefault();const name=userName.value.trim();if(!name)return;
      if(users.some(u=>u.name.toLocaleLowerCase()===name.toLocaleLowerCase())){userMessage.textContent="Ese nombre ya existe.";return;}
      const id="u_"+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
      users.push({id,name});activeUser=id;persistUsers();renderUsers();tasks=loadTasks();render();userName.value="";
      userMessage.textContent="Usuario creado: "+name;
    });
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const empty = document.getElementById("empty");
    const counter = document.getElementById("counter");

    let tasks = loadTasks();

    function save() {
      try { localStorage.setItem(userTasksKey(), JSON.stringify(tasks)); }
      catch { /* La página sigue funcionando aunque el navegador no permita guardar. */ }
    }

    function render() {
      list.replaceChildren();
      tasks.forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("completed");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.done;
        check.setAttribute("aria-label", "Completar: " + task.text);
        check.addEventListener("change", () => {
          task.done = check.checked;
          save();
          render();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Eliminar";
        remove.setAttribute("aria-label", "Eliminar: " + task.text);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
          render();
        });

        li.append(check, label, remove);
        list.append(li);
      });

      empty.hidden = tasks.length > 0;
      const pending = tasks.filter(t => !t.done).length;
      counter.textContent = pending + (pending === 1 ? " tarea pendiente" : " tareas pendientes");
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(), text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    });

    render();
  </script>
</body>
</html>
