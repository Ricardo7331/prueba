<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi lista de tareas</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #1e293b; background: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); background: white; border-radius: 18px; padding: 30px; box-shadow: 0 12px 40px #0f172a16; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { color: #64748b; margin: 0 0 24px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
    button { border: none; border-radius: 9px; padding: 11px 14px; font: inherit; cursor: pointer; }
    form button { background: #2563eb; color: white; }
    form button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 22px 0 0; }
    li { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.completed span { text-decoration: line-through; color: #94a3b8; }
    li input { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }
    li button { background: #fee2e2; color: #b91c1c; padding: 6px 10px; }
    li button:hover { background: #fecaca; }
    #empty { text-align: center; margin: 25px 0 0; }
    footer { margin-top: 18px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>✅ Mi lista de tareas</h1>
    <p>Organiza tus pendientes de forma sencilla.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Escribe una tarea..." maxlength="150" required aria-label="Nueva tarea">
      <button type="submit">Agregar</button>
    </form>
    <ul id="task-list" aria-label="Lista de tareas"></ul>
    <p id="empty">Aún no tienes tareas. ¡Agrega una!</p>
    <footer id="counter">0 tareas pendientes</footer>
  </main>
  <script>
    const STORAGE_KEY = "prueba_todo_tasks";
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const empty = document.getElementById("empty");
    const counter = document.getElementById("counter");

    let tasks;
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
      tasks = Array.isArray(stored) ? stored.filter(t => t && typeof t.text === "string" && typeof t.done === "boolean") : [];
    } catch {
      tasks = [];
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      catch { /* La página sigue funcionando aunque el navegador no permita guardar. */ }
    }

    function render() {
      list.replaceChildren();
      tasks.forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("completed");

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.done;
        check.setAttribute("aria-label", "Completar: " + task.text);
        check.addEventListener("change", () => {
          task.done = check.checked;
          save();
          render();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Eliminar";
        remove.setAttribute("aria-label", "Eliminar: " + task.text);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
          render();
        });

        li.append(check, label, remove);
        list.append(li);
      });

      empty.hidden = tasks.length > 0;
      const pending = tasks.filter(t => !t.done).length;
      counter.textContent = pending + (pending === 1 ? " tarea pendiente" : " tareas pendientes");
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(), text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    });

    render();
  </script>
</body>
</html>
